name: Trending Topic Finder

on:
  schedule:
    - cron: "*/5 * * * *"   # har 5 minute check karega /start ya button press
  workflow_dispatch: {}      # GitHub se manual "Run workflow" bhi kar sakte ho

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests yt-dlp

      - name: Check Telegram for /start or button press
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python telegram_listener.py

      - name: Commit updated state files
        run: |
          git config user.name "trending-bot"
          git config user.email "bot@users.noreply.github.com"
          git add offset.txt user_choices.json history.json || true
          git diff --cached --quiet || git commit -m "auto: update state [skip ci]"
          git push || true
