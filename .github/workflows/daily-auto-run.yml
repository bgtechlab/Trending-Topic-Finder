name: Daily Auto Trending Run

on:
  schedule:
    - cron: "0 3 * * *"   # roz subah ~8:30 AM IST (3:00 UTC) apne aap chalega
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests yt-dlp

      - name: Run trending finder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python trending_finder.py

      - name: Commit updated history
        run: |
          git config user.name "trending-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json || true
          git diff --cached --quiet || git commit -m "auto: daily history update [skip ci]"
          git push || true
