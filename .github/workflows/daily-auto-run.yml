name: Daily Auto Trending Run

on:
  schedule:
    # Start at 5:10 AM IST (23:40 UTC previous day); wait until 5:57 AM IST.
    - cron: "40 23 * * *"
  workflow_dispatch: {} # Manual test; does not wait until 5:57 AM.

permissions:
  contents: write

concurrency:
  group: daily-trending
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -U yt-dlp

      # Scheduled runs wait until 5:57 AM IST so the update arrives around 6 AM.
      - name: Wait until 5:57 AM IST
        if: github.event_name == 'schedule'
        run: |
          target=$(TZ=Asia/Kolkata date -d "05:57" +%s)
          now=$(date +%s)
          echo "Now (IST): $(TZ=Asia/Kolkata date)"
          if [ "$now" -lt "$target" ]; then
            wait_s=$((target - now))
            echo "Waiting ${wait_s}s ..."
            sleep "$wait_s"
          else
            echo "Already past 5:57 AM IST, running immediately."
          fi

      - name: Run trending finder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python trending_finder.py

      - name: Commit updated history
        run: |
          git config user.name "trending-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json || true
          git diff --cached --quiet || git commit -m "auto: daily history update [skip ci]"
          git push
