name: Daily Auto Trending Run

on:
  schedule:
    - cron: "10 0 * * *"   # सुबह 5:40 IST, देर होने पर भी लगभग 6 बजे तक आ जाएगा
  workflow_dispatch: {}      # jab chaho khud "Run workflow" dabakar bhi chala sakte ho

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests
          pip install -U yt-dlp

      - name: Run trending finder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python trending_finder.py

      - name: Commit updated history
        run: |
          git config user.name "trending-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json || true
          git diff --cached --quiet || git commit -m "auto: daily history update [skip ci]"
          git push || true
